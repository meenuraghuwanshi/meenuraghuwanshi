name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # allow manual runs
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c0268d&color_dots=%23fff0fb,%23f8c8eb,%23e99ad5,%23c75ab5,%238546c8&color_dot_border=%23e5b7df
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff75c8&color_dots=%2313091f,%23321a45,%23522a6e,%23c9a0ff,%23ff75c8&color_dot_border=%23633a7d

      - name: Push the SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
